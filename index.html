<!--
  JOSHUA PARRISH — MISSION CONTROL
  ================================================================
  Full atlas across all four entities:
    WNF Market · WNF Café · INVERT INC · Tao Capital / NOFONE

  Built for the new Ops Assistant (chief-of-staff scope), but
  usable by any new hire, future EA, or anyone in Joshua's orbit
  who needs to plug in fast.

  HOW TO EDIT
  ================================================================
  All content lives in data blocks at the top of 
<script>:
    PEOPLE      — every named human, archetype, tier, dynamics
    ENTITIES    — the 4 businesses
    STANDARDS   — Day One operating principles
    BREAK_GLASS — emergency playbook + urgency triage
    WEEK        — Joshua's operating rhythm
    FLOWS       — cross-entity touchpoints

  Edit, save, refresh. Renders.

  Markers:
    [VERIFY]   — placeholder, Joshua needs to confirm
    (open)     — known gap, will be filled later
================================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ff2bd6%22%2F%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23b026ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FFA33A%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2224%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2255%22%20font-family%3D%22Arial%20Black%2CArial%2Csans-serif%22%20font-size%3D%2272%22%20font-weight%3D%22900%22%20fill%3D%22%2305060a%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%3EA%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="WNF Atlas">
<meta name="theme-color" content="#05060a">
<title>Mission Control — Joshua Parrish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a;
    --bg-2: #0a0c12;
    --panel: #0d0f15;
    --panel-2: #11141c;
    --panel-edge: #1d2230;
    --ink: #f5f5f7;
    --ink-dim: #9aa0b0;
    --ink-faint: #5a6271;

    --magenta: #ff2bd6;
    --pink: #FF3EC8;
    --violet: #b026ff;
    --orange: #FFA33A;
    --accent: var(--pink);

    --t1: #FF3EC8;
    --t2: #b026ff;
    --t3: #FFA33A;
    --filled: #4ade80;
    --joshua: var(--orange);
    --hiring: var(--orange);
    --open: #ef4444;
    --ai-future: var(--violet);

    --grad-cta: linear-gradient(135deg, #ff2bd6 0%, #b026ff 100%);
    --grad-hover: linear-gradient(120deg, #FF3EC8, #FFA33A);
    --glow-pink: 0 10px 30px -10px rgba(255,43,214,0.45);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(ellipse at top right, rgba(176,38,255,0.10), transparent 60%),
      radial-gradient(ellipse at bottom left, rgba(255,43,214,0.08), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Space Grotesk", -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1, h2, h3, h4, h5 {
    font-family: "Archivo Black", Impact, system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 400;
  }
  a { color: var(--pink); }

  /* ============================================================
     BRAND MARKS — WNF block logo + INVERT inverted wordmark
  ============================================================ */
  .wnf-mark {
    display: inline-block;
    font-family: "Archivo Black", Impact, sans-serif;
    font-weight: 400;
    letter-spacing: -0.02em;
    padding: 0.05em 0.35em;
    border-radius: 4px;
    background: var(--grad-cta);
    color: #fff;
    -webkit-text-fill-color: #fff; /* override gradient-fill parents */
    box-shadow: 0 4px 14px -6px rgba(255,43,214,0.6);
    line-height: 1;
    vertical-align: baseline;
    text-transform: uppercase;
    margin-right: 0.15em;
  }
  /* gradient-text variant for places where a solid block is too heavy */
  .wnf-text {
    display: inline-block;
    font-family: "Archivo Black", Impact, sans-serif;
    background: linear-gradient(120deg, var(--pink) 0%, var(--violet) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.01em;
  }
  
  .cafe-mark {
    display: inline-block;
    font-family: "Archivo Black", Impact, sans-serif;
    font-weight: 400;
    letter-spacing: -0.02em;
    padding: 0.05em 0.35em;
    border-radius: 4px;
    background: linear-gradient(135deg, #FF3EC8 0%, #FFA33A 100%);
    color: #fff;
    -webkit-text-fill-color: #fff;
    box-shadow: 0 4px 14px -6px rgba(255,163,58,0.6);
    line-height: 1;
    vertical-align: baseline;
    text-transform: uppercase;
    margin-right: 0.15em;
  }

  .invert-mark {
    display: inline-block;
    font-family: "Archivo Black", Impact, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.05em 0.35em;
    border-radius: 4px;
    background: linear-gradient(135deg, #b026ff 0%, #FFA33A 100%);
    color: #fff;
    -webkit-text-fill-color: #fff;
    box-shadow: 0 4px 14px -6px rgba(176,38,255,0.6);
    transform: rotate(180deg);
    margin-right: 0.18em;
    line-height: 1;
    vertical-align: baseline;
  }

  header.top {
    padding: 30px 32px 20px; border-bottom: 1px solid var(--panel-edge);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
    flex-wrap: wrap; position: relative;
  }
  header.top::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 20% 0%, rgba(255,43,214,0.10), transparent 60%);
  }
  header.top > * { position: relative; }
  header.top h1 {
    margin: 0 0 4px; font-size: 30px; letter-spacing: 0.5px;
    background: linear-gradient(120deg, #fff 0%, #FF3EC8 60%, #b026ff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header.top .sub {
    color: var(--ink-dim); font-size: 11px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.2px;
  }
  .version-pill {
    background: linear-gradient(135deg, rgba(255,43,214,0.15), rgba(176,38,255,0.15));
    border: 1px solid var(--pink); color: var(--pink);
    padding: 8px 14px; border-radius: 100px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.2px;
    font-family: "JetBrains Mono", monospace;
    box-shadow: var(--glow-pink);
  }

  nav.tabs {
    display: flex; gap: 6px; padding: 14px 32px;
    background: rgba(5,6,10,0.7); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-edge);
    position: sticky; top: 0; z-index: 10;
    overflow-x: auto;
  }
  nav.tabs button {
    background: transparent; color: var(--ink-dim);
    border: 2px solid transparent;
    padding: 8px 18px; font-size: 11px; cursor: pointer;
    border-radius: 100px; white-space: nowrap;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 500;
    transition: all 0.2s;
  }
  nav.tabs button.active {
    color: #fff; border-color: var(--pink);
    background: var(--grad-cta);
    box-shadow: var(--glow-pink);
  }
  nav.tabs button:hover:not(.active) { color: var(--pink); border-color: rgba(255,62,200,0.4); }

  main { padding: 28px 32px 80px; max-width: 1600px; margin: 0 auto; }
  section.view { display: none; }
  section.view.active { display: block; }

  .placeholder, .info-banner {
    background: linear-gradient(135deg, rgba(255,43,214,0.08), rgba(176,38,255,0.05));
    border: 1px solid rgba(255,62,200,0.3);
    color: var(--ink); padding: 12px 16px; border-radius: 12px;
    font-size: 12px; margin: 0 0 18px; line-height: 1.6;
  }
  .placeholder strong, .info-banner strong { color: var(--pink); }

  /* ============================================================
     PEOPLE VIEW
  ============================================================ */
  .people-controls {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; align-items: center;
  }
  .search {
    flex: 1; min-width: 280px; max-width: 380px;
    background: var(--panel); color: var(--ink);
    border: 2px solid var(--panel-edge);
    padding: 12px 18px; border-radius: 100px; font-size: 13px;
    font-family: "Space Grotesk", sans-serif; transition: all 0.2s;
  }
  .search:focus { outline: none; border-color: var(--pink); box-shadow: var(--glow-pink); }
  .search::placeholder {
    color: var(--ink-faint); font-family: "JetBrains Mono", monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px;
  }
  .filter-pill {
    background: transparent; border: 2px solid var(--panel-edge);
    color: var(--ink-dim); padding: 8px 14px; border-radius: 100px;
    font-size: 10px; font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .filter-pill:hover { color: var(--pink); border-color: rgba(255,62,200,0.4); }
  .filter-pill.active {
    color: #fff; border-color: var(--pink); background: var(--grad-cta);
    box-shadow: var(--glow-pink);
  }

  .entity-section { margin-bottom: 36px; }
  .entity-section h2 {
    font-size: 22px; margin: 0 0 4px;
    display: flex; align-items: center; gap: 12px;
  }
  .entity-section .entity-tag {
    color: var(--pink); font-size: 10px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.2px;
    margin-bottom: 14px; display: block;
  }

  .people-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }
  .person {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--panel-edge);
    border-radius: 14px; padding: 18px;
    cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .person::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--grad-cta); opacity: 0; transition: opacity 0.2s;
  }
  .person:hover { border-color: var(--pink); transform: translateY(-2px); box-shadow: var(--glow-pink); }
  .person:hover::before { opacity: 1; }
  .person.tier-1::before { background: linear-gradient(90deg, var(--t1), var(--t2)); opacity: 0.6; }
  .person.tier-2::before { background: var(--t2); opacity: 0.5; }
  .person .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .person h4 {
    margin: 0; font-size: 15px;
    font-family: "Archivo Black", Impact, sans-serif;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .person .nick {
    color: var(--orange); font-weight: 500; font-size: 13px;
    font-family: "Space Grotesk", sans-serif;
    text-transform: none; letter-spacing: 0;
  }
  .person .role {
    color: var(--pink); font-size: 10px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; margin-top: 4px;
  }
  .person .summary { color: var(--ink); font-size: 13px; margin-top: 10px; line-height: 1.55; }
  .person .badges { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

  .badge {
    font-size: 9px; padding: 3px 10px; border-radius: 100px;
    background: #1f2530; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 600;
    font-family: "JetBrains Mono", monospace;
    border: 1px solid transparent;
  }
  .badge.tier-1 { background: rgba(255,62,200,0.15); color: var(--pink); border-color: rgba(255,62,200,0.4); }
  .badge.tier-2 { background: rgba(176,38,255,0.18); color: #d6a8ff; border-color: rgba(176,38,255,0.4); }
  .badge.tier-3 { background: rgba(255,163,58,0.15); color: var(--orange); border-color: rgba(255,163,58,0.4); }
  .badge.knowledge { background: rgba(56,189,248,0.12); color: #7dd3fc; border-color: rgba(56,189,248,0.3); }
  .badge.passion { background: rgba(255,163,58,0.15); color: var(--orange); border-color: rgba(255,163,58,0.4); }
  .badge.cross-entity { background: rgba(176,38,255,0.18); color: #d6a8ff; border-color: rgba(176,38,255,0.4); }
  .badge.dev { background: rgba(74,222,128,0.12); color: #86efac; border-color: rgba(74,222,128,0.3); }
  .badge.watch { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
  .badge.hiring { background: rgba(255,163,58,0.15); color: var(--orange); border-color: rgba(255,163,58,0.4); }
  .badge.external { background: rgba(154,160,176,0.1); color: var(--ink-dim); border-color: rgba(154,160,176,0.2); }
  .badge.ai-future {
    background: rgba(176,38,255,0.18); color: #d6a8ff;
    border-color: rgba(176,38,255,0.4);
    border-style: dashed;
  }

  /* drawer */
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: none; z-index: 50;
  }
  .drawer-mask.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: min(480px, 100%);
    background:
      radial-gradient(ellipse at top right, rgba(176,38,255,0.12), transparent 50%),
      var(--panel);
    border-left: 2px solid var(--pink);
    box-shadow: -10px 0 40px -10px rgba(255,43,214,0.4);
    transform: translateX(100%); transition: transform 0.25s ease;
    z-index: 51; padding: 28px 30px; overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .close {
    position: absolute; top: 14px; right: 16px;
    background: transparent; color: var(--ink-dim); border: 0;
    cursor: pointer; font-size: 22px;
  }
  .drawer h2 {
    margin: 0 0 4px; font-size: 26px;
    background: linear-gradient(120deg, #fff 0%, var(--pink) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .drawer .nick-big { color: var(--orange); font-weight: 500; margin-bottom: 8px; font-size: 15px; }
  .drawer .role-big {
    color: var(--pink); font-size: 10px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .drawer .badges { margin-bottom: 16px; }
  .drawer .field { margin-bottom: 16px; }
  .drawer .label {
    color: var(--pink); font-size: 9px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.3px;
    margin-bottom: 6px; font-weight: 500;
  }
  .drawer .value { font-size: 13px; color: var(--ink); line-height: 1.55; }
  .drawer .value.dim { color: var(--ink-dim); }
  .verify { color: var(--orange); font-size: 11px; font-style: italic; }

  /* ============================================================
     TREE VIEW
  ============================================================ */
  .tree-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }
  @media (max-width: 1100px) { .tree-grid { grid-template-columns: 1fr; } }
  .tree-entity {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--panel-edge);
    border-radius: 16px; padding: 20px;
  }
  .tree-entity h3 {
    font-size: 16px; margin: 0 0 4px;
    background: linear-gradient(120deg, #fff 0%, var(--pink) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tree-entity .entity-meta {
    color: var(--pink); font-size: 10px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; margin-bottom: 16px;
  }
  .tree-tier {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0;
    border-top: 1px dashed var(--panel-edge);
    margin-top: 8px;
  }
  .tree-tier:first-of-type { border-top: 0; padding-top: 0; }
  .tree-tier .tier-label {
    width: 100%; color: var(--ink-faint); font-size: 9px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px;
  }
  .tree-node {
    background: var(--bg-2); border: 1px solid var(--panel-edge);
    border-radius: 100px; padding: 6px 14px;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .tree-node:hover { border-color: var(--pink); color: var(--pink); }
  .tree-node.tier-1 { border-color: rgba(255,62,200,0.5); color: var(--pink); }
  .tree-node.tier-2 { border-color: rgba(176,38,255,0.5); color: #d6a8ff; }
  .tree-node.cross { border-color: rgba(176,38,255,0.4); border-style: dashed; }

  /* ============================================================
     CADENCES VIEW
  ============================================================ */
  .week-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-bottom: 20px;
  }
  .day-col {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 12px; padding: 10px; min-height: 200px;
  }
  .day-col h5 {
    margin: 0 0 8px; font-size: 11px; text-align: center;
    color: var(--pink); font-family: "JetBrains Mono", monospace;
    letter-spacing: 1.1px;
  }
  .day-col .block {
    border-radius: 8px; padding: 6px 8px; margin-bottom: 4px;
    font-size: 11px; line-height: 1.3;
  }
  .block.macro { background: rgba(255,62,200,0.18); color: #ffaee5; border-left: 2px solid var(--pink); }
  .block.store { background: rgba(255,163,58,0.15); color: #fcc88a; border-left: 2px solid var(--orange); }
  .block.portfolio { background: rgba(176,38,255,0.18); color: #d6a8ff; border-left: 2px solid var(--violet); }
  .block.invert { background: rgba(56,189,248,0.12); color: #7dd3fc; border-left: 2px solid #38bdf8; }
  .block.note { background: rgba(154,160,176,0.08); color: var(--ink-dim); font-style: italic; }

  .rhythm-rules {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px;
  }
  .rule-card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--panel-edge); border-radius: 14px; padding: 16px 18px;
  }
  .rule-card h4 { margin: 0 0 8px; font-size: 13px; color: var(--pink); }
  .rule-card .body { font-size: 13px; color: var(--ink); line-height: 1.55; }

  /* ============================================================
     FLOWS VIEW
  ============================================================ */
  .flow {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--panel-edge);
    border-left: 3px solid var(--violet);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
  }
  .flow h4 {
    margin: 0 0 4px; font-size: 14px;
    color: var(--ink); display: flex; align-items: center; gap: 8px;
  }
  .flow .from-to {
    color: var(--ink-dim); font-size: 11px; margin-bottom: 8px;
    font-family: "JetBrains Mono", monospace; letter-spacing: 1px;
  }
  .flow .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; }
  .flow .row .label { color: var(--pink); font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 1.1px; }
  .flow .friction { color: #fca5a5; font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--panel-edge); }

  /* ============================================================
     STANDARDS VIEW
  ============================================================ */
  .standard {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--panel-edge);
    border-left: 3px solid var(--pink);
    border-radius: 14px; padding: 18px 22px; margin-bottom: 14px;
  }
  .standard h3 {
    font-size: 14px; margin: 0 0 8px;
    background: linear-gradient(120deg, #fff 0%, var(--pink) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .standard .why {
    color: var(--ink); font-size: 13px; line-height: 1.6; margin-bottom: 10px;
  }
  .standard .how {
    color: var(--ink-dim); font-size: 12px;
    border-top: 1px dashed var(--panel-edge); padding-top: 10px; margin-top: 10px;
  }
  .standard .how strong { color: var(--orange); }

  .triage-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px;
    margin: 16px 0;
  }
  .triage-card {
    border-radius: 14px; padding: 14px 16px;
  }
  .triage-card.now { background: rgba(255,43,214,0.1); border: 1px solid var(--magenta); }
  .triage-card.soon { background: rgba(255,163,58,0.1); border: 1px solid var(--orange); }
  .triage-card.async { background: rgba(176,38,255,0.1); border: 1px solid var(--violet); }
  .triage-card.never { background: rgba(154,160,176,0.06); border: 1px solid #2a2f3c; }
  .triage-card h5 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: 1.1px;
    font-family: "JetBrains Mono", monospace;
  }
  .triage-card.now h5 { color: var(--magenta); }
  .triage-card.soon h5 { color: var(--orange); }
  .triage-card.async h5 { color: var(--violet); }
  .triage-card.never h5 { color: var(--ink-faint); }
  .triage-card ul { margin: 0; padding-left: 16px; font-size: 12px; }
  .triage-card li { margin-bottom: 4px; }

  /* ============================================================
     BREAK-GLASS VIEW
  ============================================================ */
  .bg-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px;
  }
  .bg-card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--panel-edge);
    border-left: 3px solid var(--magenta);
    border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 4px 20px -10px rgba(255,43,214,0.25);
  }
  .bg-card .head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 6px;
  }
  .bg-card h3 { margin: 0; font-size: 14px; }
  .bg-card .severity {
    font-size: 9px; padding: 3px 10px; border-radius: 100px;
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 700;
    font-family: "JetBrains Mono", monospace;
  }
  .sev-high { background: rgba(255,43,214,0.2); color: var(--magenta); border: 1px solid var(--magenta); }
  .sev-med  { background: rgba(255,163,58,0.15); color: var(--orange); border: 1px solid var(--orange); }
  .sev-low  { background: rgba(74,222,128,0.12); color: #86efac; border: 1px solid rgba(74,222,128,0.3); }
  .bg-card .calltree {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin: 10px 0 10px; font-size: 12px;
  }
  .bg-card .calltree .who {
    background: var(--bg-2); padding: 5px 12px; border-radius: 100px;
    color: var(--ink); border: 1px solid var(--panel-edge);
  }
  .bg-card .calltree .who strong { color: var(--pink); font-family: "JetBrains Mono", monospace; font-size: 10px; }
  .bg-card ol { margin: 0 0 6px; padding-left: 20px; color: var(--ink); }
  .bg-card ol li { margin-bottom: 5px; font-size: 12px; line-height: 1.45; }
  .bg-card .escalate {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--panel-edge);
    font-size: 11px; color: var(--ink-dim);
  }
  .bg-card .escalate strong { color: var(--orange); }

  /* ============================================================
     EDIT MODE — toggle, action buttons, form inputs
  ============================================================ */
  .header-actions {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .header-btn {
    background: transparent; color: var(--ink-dim);
    border: 2px solid var(--panel-edge);
    padding: 6px 12px; border-radius: 100px;
    font-size: 10px; cursor: pointer;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .header-btn:hover { color: var(--pink); border-color: rgba(255,62,200,0.5); }
  .header-btn.primary {
    color: #fff; border-color: var(--pink);
    background: var(--grad-cta);
    box-shadow: var(--glow-pink);
  }
  .header-btn.edit-on {
    color: #fff; border-color: var(--orange);
    background: linear-gradient(135deg, var(--orange), #ff6b00);
    box-shadow: 0 6px 18px -6px rgba(255,163,58,0.6);
  }
  .edit-indicator {
    display: none;
    background: linear-gradient(135deg, var(--orange), #ff6b00);
    color: #fff;
    padding: 6px 12px; border-radius: 100px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.2px;
    font-family: "JetBrains Mono", monospace;
    box-shadow: 0 6px 18px -6px rgba(255,163,58,0.6);
  }
  body.edit-mode .edit-indicator { display: inline-block; }
  .edited-badge {
    display: none;
    background: rgba(74,222,128,0.15);
    color: #86efac;
    border: 1px solid rgba(74,222,128,0.4);
    padding: 6px 10px; border-radius: 100px;
    font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.2px;
    font-family: "JetBrains Mono", monospace;
  }
  body.has-edits .edited-badge { display: inline-block; }

  /* Export dropdown */
  .export-menu {
    position: relative; display: inline-block;
  }
  .export-dropdown {
    display: none; position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 12px; padding: 6px; min-width: 180px; z-index: 100;
    box-shadow: 0 12px 32px -8px rgba(0,0,0,0.6);
  }
  .export-dropdown.open { display: block; }
  .export-dropdown button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0;
    color: var(--ink); padding: 8px 12px; border-radius: 8px;
    font-size: 11px; cursor: pointer;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px;
  }
  .export-dropdown button:hover { background: rgba(255,62,200,0.12); color: var(--pink); }

  /* Edit affordances on cards */
  .edit-actions {
    display: none;
    position: absolute; top: 8px; right: 8px;
    gap: 4px; z-index: 2;
  }
  body.edit-mode .edit-actions { display: flex; }
  body.edit-mode .person { padding-top: 36px; }
  .edit-actions button {
    background: rgba(13,15,21,0.9);
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    padding: 0;
  }
  .edit-actions button:hover { color: var(--pink); border-color: var(--pink); }
  .edit-actions button.del:hover { color: #fca5a5; border-color: #fca5a5; }

  .add-btn {
    display: none;
    background: transparent;
    color: var(--orange);
    border: 2px dashed rgba(255,163,58,0.5);
    padding: 10px 18px; border-radius: 100px;
    font-size: 11px; cursor: pointer;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 600;
    margin-bottom: 14px;
    transition: all 0.2s;
  }
  .add-btn:hover { background: rgba(255,163,58,0.1); border-color: var(--orange); color: var(--orange); }
  body.edit-mode .add-btn { display: inline-block; }

  /* Form inputs in drawer */
  .form-field { margin-bottom: 14px; }
  .form-field label {
    display: block;
    color: var(--pink); font-size: 9px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.3px;
    margin-bottom: 6px; font-weight: 500;
  }
  .form-field input,
  .form-field textarea,
  .form-field select {
    width: 100%;
    background: var(--bg-2); color: var(--ink);
    border: 2px solid var(--panel-edge);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 13px; line-height: 1.5;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-field textarea { min-height: 70px; resize: vertical; font-family: "Space Grotesk", sans-serif; }
  .form-field input:focus,
  .form-field textarea:focus,
  .form-field select:focus {
    outline: none; border-color: var(--pink); box-shadow: var(--glow-pink);
  }
  .form-field .hint {
    color: var(--ink-faint); font-size: 10px; margin-top: 4px;
    font-family: "JetBrains Mono", monospace;
  }
  .form-actions {
    display: flex; gap: 10px; margin-top: 20px;
    padding-top: 16px; border-top: 1px dashed var(--panel-edge);
  }
  .form-actions button {
    flex: 1;
    padding: 12px 18px; border-radius: 100px;
    font-size: 11px; cursor: pointer;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 700;
    transition: all 0.2s;
    border: 2px solid var(--panel-edge);
    background: transparent; color: var(--ink-dim);
  }
  .form-actions button.save {
    color: #fff; border-color: var(--pink);
    background: var(--grad-cta);
    box-shadow: var(--glow-pink);
  }
  .form-actions button.cancel:hover {
    color: #fca5a5; border-color: #fca5a5;
  }

  /* Style other card types similarly for edit mode positioning */
  .standard, .flow, .bg-card { position: relative; }
  body.edit-mode .standard,
  body.edit-mode .flow,
  body.edit-mode .bg-card { padding-top: 40px; }



  /* "team" = generic supporting cast, pending hierarchy assignment */
  .person.team::before { background: var(--ink-faint); opacity: 0.35; }
  .badge.team { background: rgba(154,160,176,0.1); color: var(--ink-dim); border-color: rgba(154,160,176,0.3); }
  .tree-node.team { border-color: var(--panel-edge); color: var(--ink-dim); border-style: dashed; }



  /* Brand logo row in header */
  .brand-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 6px 0 6px;
    font-family: "Archivo Black", Impact, sans-serif;
    font-size: 18px; letter-spacing: 0.02em;
  }
  .brand-row .brand-text { color: var(--ink); text-transform: uppercase; letter-spacing: 0.5px; }
  .brand-row .brand-sep { color: var(--ink-faint); font-family: "JetBrains Mono", monospace; font-size: 14px; }
  .brand-row .wnf-mark { font-size: 16px; }
  .brand-row .invert-mark { font-size: 16px; }
  @media (max-width: 640px) {
    .brand-row { font-size: 14px; }
    .brand-row .wnf-mark, .brand-row .invert-mark { font-size: 13px; }
  }

  /* ============================================================
     TIER LANDING — sections by tier, cards show entity chip
  ============================================================ */
  .tier-section { margin-bottom: 40px; }
  .tier-section .tier-header {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .tier-section h2 {
    font-size: 22px; margin: 0;
    font-family: "Archivo Black", Impact, sans-serif;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .tier-section h2.el-jefe        { background: linear-gradient(120deg, var(--orange) 0%, var(--pink) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tier-section h2.commander      { background: linear-gradient(120deg, var(--pink) 0%, var(--violet) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tier-section h2.senior-operator{ color: #d6a8ff; }
  .tier-section h2.ops-assistant  { color: var(--orange); }
  .tier-section h2.squad-lead     { color: #7dd3fc; }
  .tier-section h2.rogue-ranger   { color: #86efac; }
  .tier-section h2.signal-carrier { color: #fcc88a; }
  .tier-section h2.team           { color: var(--ink-dim); }
  .tier-section h2.external       { color: var(--ink-dim); }
  .tier-section h2.ai-future      { color: #d6a8ff; }
  .tier-section .tier-meta {
    color: var(--ink-dim); font-size: 11px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px;
  }
  .tier-section .tier-meta.open { color: var(--orange); }
  .tier-section .tier-desc {
    color: var(--ink-dim); font-size: 12px; margin-bottom: 14px;
    line-height: 1.6;
  }

  /* Entity chip on each card */
  .person .entity-chip {
    display: inline-block;
    font-size: 9px; padding: 3px 10px; border-radius: 100px;
    background: rgba(255,62,200,0.1); color: var(--pink);
    border: 1px solid rgba(255,62,200,0.3);
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 700;
    font-family: "JetBrains Mono", monospace;
    margin-bottom: 8px;
  }
  .person .entity-chip.cafe   { background: rgba(255,163,58,0.1); color: var(--orange); border-color: rgba(255,163,58,0.35); }
  .person .entity-chip.invert { background: rgba(176,38,255,0.12); color: #d6a8ff; border-color: rgba(176,38,255,0.35); }
  .person .entity-chip.tao    { background: rgba(56,189,248,0.1); color: #7dd3fc; border-color: rgba(56,189,248,0.35); }
  .person .entity-chip.all    { background: linear-gradient(135deg, rgba(255,62,200,0.15), rgba(176,38,255,0.15)); color: #fff; border-color: var(--pink); }

  /* Empty seat card (placeholder for open Squad Lead seats) */
  .person.open-seat {
    border: 2px dashed rgba(255,163,58,0.5);
    background: transparent;
    text-align: center;
    display: flex; align-items: center; justify-content: center;
    min-height: 140px;
    color: var(--orange);
    cursor: default;
  }
  .person.open-seat:hover { transform: none; box-shadow: none; }
  .person.open-seat::before { display: none; }

  /* ============================================================
     WNF MARKET HIERARCHY — new tier classes
  ============================================================ */
  .person.el-jefe::before { background: linear-gradient(90deg, var(--orange), var(--pink)); opacity: 1; height: 4px; }
  .person.commander::before { background: linear-gradient(90deg, var(--pink), var(--violet)); opacity: 1; height: 3px; }
  .person.senior-operator::before { background: var(--violet); opacity: 0.7; height: 3px; }
  .person.ops-assistant::before { background: var(--orange); opacity: 0.5; }
  .person.squad-lead::before { background: linear-gradient(90deg, var(--violet), #38bdf8); opacity: 0.6; }
  .person.rogue-ranger::before { background: #4ade80; opacity: 0.6; }
  .person.signal-carrier::before { background: #fcc88a; opacity: 0.5; }
  .person.rookie::before { background: var(--ink-faint); opacity: 0.4; }
  .person.recruit::before { background: var(--panel-edge); opacity: 0.3; }

  /* tier badges in card grid */
  .badge.el-jefe        { background: linear-gradient(135deg, rgba(255,163,58,0.25), rgba(255,62,200,0.25)); color: var(--orange); border-color: var(--orange); }
  .badge.commander      { background: linear-gradient(135deg, rgba(255,62,200,0.2), rgba(176,38,255,0.2)); color: var(--pink); border-color: var(--pink); }
  .badge.senior-operator{ background: rgba(176,38,255,0.18); color: #d6a8ff; border-color: rgba(176,38,255,0.5); }
  .badge.ops-assistant  { background: rgba(255,163,58,0.15); color: var(--orange); border-color: rgba(255,163,58,0.4); }
  .badge.squad-lead     { background: rgba(56,189,248,0.15); color: #7dd3fc; border-color: rgba(56,189,248,0.4); }
  .badge.rogue-ranger   { background: rgba(74,222,128,0.15); color: #86efac; border-color: rgba(74,222,128,0.4); }
  .badge.signal-carrier { background: rgba(255,200,138,0.12); color: #fcc88a; border-color: rgba(255,200,138,0.35); }
  .badge.rookie  { background: rgba(154,160,176,0.1); color: var(--ink-dim); border-color: rgba(154,160,176,0.25); }
  .badge.recruit        { background: rgba(154,160,176,0.06); color: var(--ink-faint); border-color: rgba(154,160,176,0.2); }

  /* OG badge — gold/amber, tenure honor */
  .badge.og {
    background: linear-gradient(135deg, rgba(255,200,80,0.25), rgba(255,140,0,0.2));
    color: #ffd966;
    border: 1px solid rgba(255,200,80,0.5);
    text-shadow: 0 0 8px rgba(255,200,80,0.5);
    font-weight: 700;
  }

  /* tree node tier colors */
  .tree-node.el-jefe        { border-color: var(--orange); color: var(--orange); }
  .tree-node.commander      { border-color: var(--pink); color: var(--pink); }
  .tree-node.senior-operator{ border-color: rgba(176,38,255,0.6); color: #d6a8ff; }
  .tree-node.ops-assistant  { border-color: rgba(255,163,58,0.5); color: var(--orange); }
  .tree-node.squad-lead     { border-color: rgba(56,189,248,0.6); color: #7dd3fc; }
  .tree-node.rogue-ranger   { border-color: rgba(74,222,128,0.6); color: #86efac; }
  .tree-node.signal-carrier { border-color: rgba(255,200,138,0.5); color: #fcc88a; }
  .tree-node.rookie  { border-color: var(--panel-edge); color: var(--ink-dim); }
  .tree-node.recruit        { border-color: var(--panel-edge); color: var(--ink-faint); }

  /* ============================================================
     RESPONSIVE LAYOUT
  ============================================================ */
  /* Tablet (641 - 1024px) */
  @media (max-width: 1024px) {
    .people-grid { grid-template-columns: repeat(2, 1fr); }
    .bg-grid { grid-template-columns: repeat(2, 1fr); }
    .tree-grid { grid-template-columns: 1fr; }
    main { padding: 24px 22px 80px; }
    header.top { padding: 24px 22px 16px; }
    nav.tabs { padding: 12px 22px; }
  }

  /* Mobile (≤ 640px) */
  @media (max-width: 640px) {
    body { font-size: 13px; }

    header.top {
      padding: 20px 14px 14px;
      flex-direction: column; align-items: flex-start; gap: 12px;
    }
    header.top h1 { font-size: 22px; }
    header.top .sub { font-size: 10px; line-height: 1.5; }
    .version-pill { font-size: 9px; padding: 6px 10px; }
    .header-actions { width: 100%; }

    nav.tabs {
      padding: 10px 12px;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }
    nav.tabs button {
      padding: 10px 14px; font-size: 10px;
      min-height: 40px;
    }

    main { padding: 16px 12px 80px; }

    .info-banner, .placeholder { font-size: 12px; padding: 10px 12px; }

    /* People */
    .people-controls { gap: 8px; }
    .search { min-width: 0; flex: 1 1 100%; max-width: none; padding: 10px 14px; }
    .filter-pill { min-height: 40px; padding: 8px 12px; font-size: 10px; }
    .people-grid { grid-template-columns: 1fr; gap: 10px; }
    .person { padding: 14px; }
    .entity-section h2 { font-size: 18px; }

    /* Tree */
    .tree-grid { grid-template-columns: 1fr; gap: 14px; }
    .tree-entity { padding: 16px; }

    /* Cadences — horizontal scroll for week */
    .week-grid {
      display: flex; overflow-x: auto; gap: 8px;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .day-col { min-width: 200px; flex: 0 0 auto; }
    .rhythm-rules { grid-template-columns: 1fr; }

    /* Flows */
    .flow { padding: 14px; }
    .flow .row { gap: 8px; flex-direction: column; }

    /* Standards */
    .standard { padding: 14px 16px; }
    .triage-grid { grid-template-columns: 1fr; }

    /* Break-glass */
    .bg-grid { grid-template-columns: 1fr; gap: 10px; }
    .bg-card { padding: 14px; }
    .bg-card .head { flex-direction: column; align-items: flex-start; gap: 6px; }

    /* Drawer full-width */
    .drawer {
      width: 100%;
      padding: 20px 18px;
    }
    .drawer h2 { font-size: 22px; }

    /* Edit-mode tweaks */
    body.edit-mode .person { padding-top: 40px; }
    .add-btn { width: 100%; text-align: center; }
  }

  
  /* ============================================================
     CONTACTS LOCK / UNLOCK
  ============================================================ */
  .lock-btn { position: relative; }
  body.contacts-unlocked .lock-btn {
    color: #fff; border-color: #4ade80;
    background: linear-gradient(135deg, #4ade80, #16a34a);
    box-shadow: 0 6px 18px -6px rgba(74,222,128,0.6);
  }
  .lock-modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    display: none; z-index: 100;
    align-items: center; justify-content: center;
  }
  .lock-modal-mask.open { display: flex; }
  .lock-modal {
    background:
      radial-gradient(ellipse at top right, rgba(176,38,255,0.18), transparent 60%),
      var(--panel);
    border: 2px solid var(--pink);
    border-radius: 18px;
    padding: 28px 30px;
    width: min(420px, calc(100% - 32px));
    box-shadow: 0 20px 60px -20px rgba(255,43,214,0.5);
  }
  .lock-modal h2 {
    margin: 0 0 6px; font-size: 22px;
    background: linear-gradient(120deg, #fff 0%, var(--pink) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lock-modal .sub {
    color: var(--ink-dim); font-size: 11px;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px;
    margin-bottom: 18px;
  }
  .lock-modal input[type=password] {
    width: 100%; padding: 12px 16px;
    background: var(--bg-2); color: var(--ink);
    border: 2px solid var(--panel-edge);
    border-radius: 100px;
    font-family: "Space Grotesk", sans-serif;
    font-size: 14px; letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .lock-modal input[type=password]:focus {
    outline: none; border-color: var(--pink); box-shadow: var(--glow-pink);
  }
  .lock-modal .actions { display: flex; gap: 10px; margin-top: 16px; }
  .lock-modal .actions button {
    flex: 1; padding: 12px; border-radius: 100px;
    font-size: 11px; cursor: pointer;
    font-family: "JetBrains Mono", monospace;
    text-transform: uppercase; letter-spacing: 1.1px; font-weight: 700;
    transition: all 0.2s;
    border: 2px solid var(--panel-edge);
    background: transparent; color: var(--ink-dim);
  }
  .lock-modal .actions button.go {
    color: #fff; border-color: var(--pink);
    background: var(--grad-cta);
    box-shadow: var(--glow-pink);

const board = document.body;

function renderPeople(filter = "", tier = "all") {
  const el = document.getElementById("people");
  const f = filter.toLowerCase();

  el.innerHTML = `
    <div class="people-controls">
      <input class="search" id="search" placeholder="Search people, roles, nicknames…" value="${escapeAttr(filter)}">
      <button class="filter-pill ${tier==='all'?'active':''}" data-tier="all">All</button>
      <button class="filter-pill ${tier==='commander'?'active':''}" data-tier="commander">Commanders</button>
      <button class="filter-pill ${tier==='senior-operator'?'active':''}" data-tier="senior-operator">Senior Operator</button>
      <button class="filter-pill ${tier==='squad-lead'?'active':''}" data-tier="squad-lead">Squad Leads</button>
      <button class="filter-pill ${tier==='rogue-ranger'?'active':''}" data-tier="rogue-ranger">Rogue Rangers</button>
      <button class="filter-pill ${tier==='signal-carrier'?'active':''}" data-tier="signal-carrier">Signal Carriers</button>
      <button class="filter-pill ${tier==='og'?'active':''}" data-tier="og">OG</button>
      <button class="filter-pill ${tier==='external'?'active':''}" data-tier="external">External Partners</button>
    </div>
    <button class="add-btn" data-add="person">+ Add Person</button>
    <div class="info-banner">
      <strong>The WNF Market hierarchy is the landing page.</strong> Tiers organize the team top-to-bottom: <strong>El Jefe</strong> → <strong>Commander</strong> → <strong>Senior Operator</strong> → <strong>Ops Assistant</strong> → <strong>Squad Lead</strong> → <strong>Rogue Ranger</strong> → <strong>Signal Carrier</strong> → <strong>Rookies &amp; Recruits</strong>. Each card shows the business (Market, Café, INVERT). Slots below Senior Operator are open until promotion conversations land.
    </div>
    ${renderTierSection('el-jefe', 'El Jefe', 'Final authority and leader of the entire operation.', filter, tier)}
    ${renderTierSection('commander', 'Commander', 'Primary change agents and floor leaders. Drive culture, maintain standards, run the floor with full authority.', filter, tier)}
    ${renderTierSection('senior-operator', 'Senior Operator', 'Long-tenured systems owner. Manages scheduling, ordering, inventory, and operational systems that keep the store running.', filter, tier)}
    ${renderTierSection('ops-assistant', 'Ops Assistant', 'Direct extension of El Jefe. Special projects, communication, operational support.', filter, tier)}
    ${renderTierSection('squad-lead', 'Squad Lead', 'Floor-level leadership. When no Commander is present, Squad Lead is the highest authority on the floor and prioritizes guest amazement.', filter, tier)}
    ${renderTierSection('rogue-ranger', 'Rogue Ranger', 'Elite team member with high autonomy and strong leadership presence on the floor.', filter, tier)}
    ${renderTierSection('signal-carrier', 'Signal Carrier', 'Core team member who consistently delivers guest amazement and calls out problems in real time.', filter, tier)}
    ${renderTierSection('team', 'Rookies, Recruits &amp; Team — pending hierarchy', 'Aggregate rosters and team members not yet assigned a tier. Promotion conversations will move them up.', filter, tier)}
    ${renderTierSection('external', 'External Partners', 'Vendors, contractors, accounting, restoration services. Not part of the WNF hierarchy.', filter, tier)}
    ${renderTierSection('ai-future', 'AI / Future Seats', 'Speculative roles and tools on the 12-month roadmap.', filter, tier)}
  `;

  document.getElementById("search").addEventListener("input", e => renderPeople(e.target.value, tier));
  el.querySelectorAll(".filter-pill").forEach(btn => {
    btn.addEventListener("click", () => renderPeople(filter, btn.dataset.tier));
  });
  el.querySelectorAll(".person").forEach(node => {
    node.addEventListener("click", (ev) => {
      if (ev.target.closest(".edit-actions")) return;
      if (node.dataset.id) openDrawer(node.dataset.id);
    });
  });
  el.querySelectorAll(".edit-actions [data-edit-person]").forEach(btn => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      openPersonEditor(btn.dataset.editPerson);
    });
  });
  el.querySelectorAll(".edit-actions [data-del-person]").forEach(btn => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.delPerson;
      const p = PEOPLE.find(x => x.id === id);
      if (p && confirm(`Delete "${p.name}"? This can be undone with Reset.`)) {
        PEOPLE = PEOPLE.filter(x => x.id !== id);
        persist();
        renderAll();
      }
    });
  });
  el.querySelectorAll("[data-add='person']").forEach(btn => {
    btn.addEventListener("click", () => openPersonEditor(null));
  });

function entityChipLabel(entity) {
  if (entity === 'market') return 'WNF Market';
  if (entity === 'cafe')   return 'WNF Café';
  if (entity === 'invert') return 'INVERT';
  if (entity === 'tao')    return 'Tao Capital';
  if (entity === 'all')    return 'All entities';
  return entity;
}

function renderTierSection(tierKey, label, desc, filter, currentTier) {
  const f = filter.toLowerCase();
  let filtered = PEOPLE.filter(p => {
    if (p.tier !== tierKey) return false;
    if (currentTier !== "all") {
      if (currentTier === "og" && !(p.badges||[]).includes("og")) return false;
      else if (currentTier !== "og" && p.tier !== currentTier && !(currentTier === 'external' && p.tier === 'external')) return false;
    }
    if (f && !p.name.toLowerCase().includes(f) && !p.role.toLowerCase().includes(f) && !((p.nick||"").toLowerCase().includes(f))) return false;
    return true;
  });

  // For Squad Lead: if filter is 'all' or 'squad-lead' and Market has fewer than 3, show open seats
  let openSeats = '';
  if (tierKey === 'squad-lead' && (currentTier === 'all' || currentTier === 'squad-lead')) {
    const realSeats = filtered.filter(p => p.id !== 'floor_lead_bench').length;
    const benchIncluded = filtered.some(p => p.id === 'floor_lead_bench');
    if (benchIncluded) {
      // The bench card represents 3 seats; no extra placeholders needed
    } else {
      const need = Math.max(0, 3 - realSeats);
      for (let i = 0; i < need; i++) {
        openSeats += '<div class="person open-seat">+ Open seat — pending promotion</div>';
      }
    }
  }

  // For Rogue Ranger / Signal Carrier — show "open" indicator if empty
  let openMessage = '';
  if (filtered.length === 0 && ['rogue-ranger','signal-carrier'].includes(tierKey) && (currentTier === 'all' || currentTier === tierKey)) {
    openMessage = '<div class="person open-seat">+ Open — pending promotion conversations</div>';
  }

  if (filtered.length === 0 && !openMessage && !openSeats) return '';

  const metaCount = filtered.length === 0 ? 'open' : `${filtered.length} ${filtered.length === 1 ? 'seat' : 'seats'}`;
  const metaClass = filtered.length === 0 ? 'tier-meta open' : 'tier-meta';

  return `
    <div class="tier-section">
      <div class="tier-header">
        <h2 class="${tierKey}">${label}</h2>
      </div>
      <div class="tier-desc">${desc}</div>
      <div class="people-grid">
        ${filtered.map(p => `
          <div class="person ${p.tier}" data-id="${p.id}">
            <div class="edit-actions">
              <button data-edit-person="${p.id}" title="Edit">&#9998;</button>
              <button class="del" data-del-person="${p.id}" title="Delete">&times;</button>
            </div>
            <span class="entity-chip ${p.entity}">${entityChipLabel(p.entity)}</span>
            <div class="row">
              <h4>${p.name} ${p.nick ? `<span class="nick">"${p.nick}"</span>` : ''}</h4>
            </div>
            <div class="role">${p.role}</div>
            <div class="summary">${p.summary}</div>
            <div class="badges">
              ${(p.badges||[]).map(b => `<span class="badge ${b}">${b.replace('-', ' ')}</span>`).join('')}
            </div>
            ${p.phone ? `<div class="contact-line">&#9742; <a href="tel:${p.phone.replace(/[^0-9+]/g, '')}">${p.phone}</a></div>` : ''}
          </div>
        `).join('')}
        ${openSeats}
        ${openMessage}
      </div>
    </div>
  `;
}

function renderEntitySection(entityKey, filter, tier, overrideTitle) {
  const f = filter.toLowerCase();
  const entityMeta = ENTITIES[entityKey] || { name: overrideTitle, tag: "", desc: "" };
  const filtered = PEOPLE.filter(p => {
    const matchEntity = entityKey === "all" ? (p.entity === "all" || p.tier === "external" || p.tier === "ai-future") : (p.entity === entityKey);
    if (!matchEntity) return false;
    if (tier !== "all") {
      if (tier === "og" && !(p.badges||[]).includes("og")) return false;
      else if (tier === "cross-entity" && !p.badges.includes("cross-entity")) return false;
      else if (tier === "external" && p.tier !== "external") return false;
      else if (tier === "ai-future" && p.tier !== "ai-future") return false;
      else if (tier !== "og" && tier !== "cross-entity" && tier !== "external" && tier !== "ai-future" && p.tier !== tier) return false;
    }
    if (f && !p.name.toLowerCase().includes(f) && !p.role.toLowerCase().includes(f) && !(p.nick||"").toLowerCase().includes(f)) return false;
    return true;
  });
  if (filtered.length === 0) return "";
  return `
    <div class="entity-section">
      <h2>${entityMeta.name}</h2>
      <span class="entity-tag">${entityMeta.tag || ""}</span>
      <div class="people-grid">
        ${filtered.map(p => `
          <div class="person ${p.tier}" data-id="${p.id}">
            <div class="edit-actions">
              <button data-edit-person="${p.id}" title="Edit">&#9998;</button>
              <button class="del" data-del-person="${p.id}" title="Delete">&times;</button>
            </div>
            <div class="row">
              <h4>${p.name} ${p.nick ? `<span class="nick">"${p.nick}"</span>` : ''}</h4>
            </div>
            <div class="role">${p.role}</div>
            <div class="summary">${p.summary}</div>
            <div class="badges">
              ${(p.badges||[]).map(b => `<span class="badge ${b}">${b.replace('-', ' ')}</span>`).join('')}
            </div>
            ${p.phone ? `<div class="contact-line">&#9742; <a href="tel:${p.phone.replace(/[^0-9+]/g, '')}">${p.phone}</a></div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function openDrawer(id) {
  const p = PEOPLE.find(x => x.id === id);
  if (!p) return;
  const reportsName = id => {
    if (!id || id === "—") return "—";
    const rp = PEOPLE.find(x => x.id === id);
    return rp ? rp.name : id;
  };
  const directReports = (p.direct_reports || []).map(r => reportsName(r)).join(", ") || "—";
  document.getElementById("drawer-body").innerHTML = `
    <div class="role-big">${ENTITIES[p.entity]?.name || (p.entity === 'all' ? 'All Entities' : p.entity)}</div>
    <h2>${p.name}</h2>
    ${p.nick ? `<div class="nick-big">"${p.nick}"</div>` : ''}
    <div class="role-big">${p.role}</div>
    <div class="badges">
      ${p.badges.map(b => `<span class="badge ${b}">${b.replace('-', ' ')}</span>`).join('')}
    </div>

    <div class="field"><div class="label">Summary</div><div class="value">${p.summary}</div></div>
    ${p.phone ? `<div class="field"><div class="label">Phone</div><div class="value" style="font-family:'JetBrains Mono', monospace; color:var(--pink);">${p.phone}</div></div>` : ''}
    ${p.contact_label ? `<div class="field"><div class="label">Contact label</div><div class="value dim">${p.contact_label}</div></div>` : ''}
    <div class="field"><div class="label">Reports to</div><div class="value">${p.reports_to}</div></div>
    <div class="field"><div class="label">Direct reports</div><div class="value">${directReports}</div></div>
    <div class="field"><div class="label">Decision authority</div><div class="value">${p.decision_authority}</div></div>

    <div class="field"><div class="label">CS archetype</div><div class="value">${p.archetype}</div></div>
    <div class="field"><div class="label">Cross-entity touchpoints</div><div class="value">${p.cross_entity}</div></div>
    <div class="field"><div class="label">Watch-outs</div><div class="value">${p.watch_outs}</div></div>
  `;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("mask").classList.add("open");
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("mask").classList.remove("open");
}

// Edit mode · localStorage persistence · Import / Export
// ============================================================
const STORAGE_KEY = "atlas-v2-data";

function escapeAttr(s) {
  return String(s == null ? "" : s).replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function currentDataSnapshot() {
  return { entities: ENTITIES, people: PEOPLE, standards: STANDARDS, week: WEEK, flows: FLOWS, break_glass: BREAK_GLASS, triage: TRIAGE };
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentDataSnapshot()));
    document.body.classList.add("has-edits");
  } catch (e) {
    console.warn("persist failed", e);
  }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.entities)    ENTITIES    = data.entities;
    if (data.people)      PEOPLE      = data.people;
    if (data.standards)   STANDARDS   = data.standards;
    if (data.week)        WEEK        = data.week;
    if (data.flows)       FLOWS       = data.flows;
    if (data.break_glass) BREAK_GLASS = data.break_glass;
    if (data.triage)      TRIAGE      = data.triage;
    document.body.classList.add("has-edits");
    return true;
  } catch (e) {
    console.warn("loadFromStorage failed", e);
    return false;
  }
}

function resetData() {
  if (!confirm("Reset all data to the file defaults? This will wipe your local edits and reload the page.")) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  location.reload();
}

function renderAll() {
  // Preserve current active tab
  const active = document.querySelector(".tab-btn.active");
  renderPeople();
  renderTree();
  renderCadences();
  renderFlows();
  renderStandards();
  renderBreakGlass();
  if (active) {
    // nothing to do; views remain visible based on .active class on sections
  }
}

const exportBtn = document.getElementById("export-btn");

exportBtn.addEventListener("click", (e) => {

});
document.addEventListener("click", (e) => {

});
exportDropdown.addEventListener("click", (e) => {
  const action = e.target.dataset.action;
  if (!action) return;
  exportDropdown.classList.remove("open");
  if (action === "export-html") exportHTML();
  if (action === "export-json") exportJSON();

});
document.getElementById("import-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (typeof data !== "object" || data === null) throw new Error("Not an object");
      // soft-validate shape
      if (data.entities)    ENTITIES    = data.entities;
      if (Array.isArray(data.people))      PEOPLE      = data.people;
      if (Array.isArray(data.standards))   STANDARDS   = data.standards;
      if (data.week && Array.isArray(data.week.days))   WEEK        = data.week;
      if (Array.isArray(data.flows))       FLOWS       = data.flows;
      if (Array.isArray(data.break_glass)) BREAK_GLASS = data.break_glass;
      if (Array.isArray(data.triage))      TRIAGE      = data.triage;
      persist();
      renderAll();
      alert("Import complete.");
    } catch (err) {
      alert("Import failed: " + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ""; // allow re-import of same filename
});

function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function exportJSON() {
  downloadFile("operating_atlas_data.json", JSON.stringify(currentDataSnapshot(), null, 2), "application/json");
}

// Rebuild a clean HTML file by swapping each `let X = ...;` data block in the
// captured original script source with the current in-memory value.
function exportHTML() {
  let scriptText = __ORIGINAL_SCRIPT_TEXT;
  if (!scriptText) {
    alert("Could not access the original script source. Try Export JSON instead.");
    return;
  }
  const replaceBlock = (src, varName, valueJSON) => {
    // Each top-level data block opens with `let VARNAME = [` or `let VARNAME = {`
    // and closes with a matching `\n];` or `\n};` at the start of a line.
    // Lazy match the body, then require the closer to be on its own line.
    const re = new RegExp("(let\\s+" + varName + "\\s*=\\s*)([\\s\\S]*?)(\\n\\][;]|\\n\\}[;])", "");
    if (!re.test(src)) {
      console.warn("Could not match block for " + varName);
      return src;
    }
    return src.replace(re, (m, prefix) => prefix + valueJSON + ";");
  };

  const data = currentDataSnapshot();
  scriptText = replaceBlock(scriptText, "ENTITIES",    JSON.stringify(data.entities,    null, 2));
  scriptText = replaceBlock(scriptText, "PEOPLE",      JSON.stringify(data.people,      null, 2));
  scriptText = replaceBlock(scriptText, "STANDARDS",   JSON.stringify(data.standards,   null, 2));
  scriptText = replaceBlock(scriptText, "TRIAGE",      JSON.stringify(data.triage,      null, 2));
  scriptText = replaceBlock(scriptText, "WEEK",        JSON.stringify(data.week,        null, 2));
  scriptText = replaceBlock(scriptText, "FLOWS",       JSON.stringify(data.flows,       null, 2));
  scriptText = replaceBlock(scriptText, "BREAK_GLASS", JSON.stringify(data.break_glass, null, 2));

  // Build the full HTML: take everything outside the inline script tag and splice ours back in.
  const html = document.documentElement.outerHTML;
  // Replace the inline data script — match the *first* script that contains our marker line.
  const marker = "let ENTITIES";
  const scriptOpen = "<" + "script";
  const scriptClose = "<" + "/script>";
  const scriptRegex = new RegExp(scriptOpen + "\\b[^>]*>([\\s\\S]*?)" + scriptClose, "gi");
  let replaced = false;
  const out = html.replace(scriptRegex, (match, inner) => {
    if (!replaced && inner.indexOf(marker) !== -1) {
      replaced = true;
      return "<" + "script>" + scriptText + "<" + "/script>";
    }
    return match;
  });
  if (!replaced) {
    alert("Could not splice script back in. Use Export JSON instead.");
    return;
  }
  downloadFile("operating_atlas_v2.html", "<!DOCTYPE html>\n" + out, "text/html");
}

function openEditDrawer(html) {
  document.getElementById("drawer-body").innerHTML = html;
  document.getElementById("drawer").classList.add("open");
  document.getElementById("mask").classList.add("open");
}

function fieldInput(label, name, value, opts = {}) {
  const v = value == null ? "" : value;
  const hint = opts.hint ? `<div class="hint">${opts.hint}</div>` : "";
  if (opts.textarea) {
    return `<div class="form-field"><label>${label}</label><textarea name="${name}" rows="${opts.rows || 3}">${escapeHtml(v)}</textarea>${hint}</div>`;
  }
  return `<div class="form-field"><label>${label}</label><input name="${name}" type="text" value="${escapeAttr(v)}">${hint}</div>`;
}

function fieldSelect(label, name, value, options) {
  return `<div class="form-field"><label>${label}</label><select name="${name}">` +
    options.map(o => `<option value="${escapeAttr(o.value)}" ${o.value === value ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("") +
    `</select></div>`;
}

function collectForm(formEl) {
  const out = {};
  formEl.querySelectorAll("input[name], textarea[name], select[name]").forEach(el => {
    out[el.name] = el.value;
  });
  return out;
}

function makePersonId(name) {
  const base = (name || "person").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "person";
  let id = base, n = 1;
  while (PEOPLE.some(p => p.id === id)) { id = base + "_" + (++n); }
  return id;
}

    : JSON.parse(JSON.stringify(PEOPLE.find(x => x.id === id) || {}));

  const entityOptions = [
    { value: "market", label: "WNF Market" },
    { value: "cafe",   label: "WNF Café" },
    { value: "invert", label: "INVERT Inc" },

    { value: "all",    label: "All / cross-entity" }

    { value: "tier-3",     label: "Tier 3 — Team" },

    { value: "hiring",     label: "Hiring (open seat)" },

      ${fieldInput("Badges (comma-separated)", "badges", (p.badges || []).join(", "), { hint: "e.g. tier-1, knowledge, cross-entity, dev, hiring, external, passion, ai-future, watch, all-entities" })}
      ${fieldInput("Summary", "summary", p.summary, { textarea: true, rows: 4 })}
      ${fieldInput("Reports to", "reports_to", p.reports_to)}

    if (isNew) FLOWS.push(next);
    else FLOWS[index] = next;
    persist();
    closeDrawer();
    renderAll();

}

function openBreakGlassEditor(index) {
  const isNew = index == null;
  const b = isNew
    ? { title: "", severity: "med", severity_label: "", primary: "", secondary: "", steps: [], escalate: "" }
    : JSON.parse(JSON.stringify(BREAK_GLASS[index]));
  const severityOptions = [
    { value: "high", label: "High" },
    { value: "med",  label: "Medium" },
    { value: "low",  label: "Low" }
  ];
  const html = `
    <form id="edit-form" onsubmit="return false;">
      <h2>${isNew ? "Add Break-Glass Card" : "Edit Break-Glass Card"}</h2>
      <div class="role-big">Emergency playbook</div>
      ${fieldInput("Title", "title", b.title)}
      ${fieldSelect("Severity", "severity", b.severity, severityOptions)}
      ${fieldInput("Severity label", "severity_label", b.severity_label, { hint: "Short tag shown beside severity — e.g. 'Revenue stops'" })}
      ${fieldInput("Primary", "primary", b.primary, { textarea: true, rows: 2 })}
      ${fieldInput("Secondary / backup", "secondary", b.secondary, { textarea: true, rows: 2 })}
      ${fieldInput("Steps (one per line)", "steps", (b.steps || []).join("\n"), { textarea: true, rows: 8 })}
      ${fieldInput("Escalate to Joshua", "escalate", b.escalate, { textarea: true, rows: 3 })}
      <div class="form-actions">
        <button type="button" class="cancel" id="form-cancel">Cancel</button>
        <button type="button" class="save"   id="form-save">Save</button>
      </div>
    </form>
  `;
  openEditDrawer(html);
  document.getElementById("form-cancel").addEventListener("click", closeDrawer);
  document.getElementById("form-save").addEventListener("click", () => {
    const v = collectForm(document.getElementById("edit-form"));
    const next = {
      title: v.title.trim(),
      severity: v.severity,
      severity_label: v.severity_label.trim(),
      primary: v.primary.trim(),
      secondary: v.secondary.trim(),
      steps: v.steps.split("\n").map(s => s.trim()).filter(Boolean),
      escalate: v.escalate.trim()
    };
    if (!next.title) { alert("Title is required."); return; }
    if (isNew) BREAK_GLASS.push(next);
    else BREAK_GLASS[index] = next;
    persist();
    closeDrawer();
    renderAll();
  });
}

const CONTACTS_KEY = "atlas-v2-contacts-unlocked";

async function decryptContacts(password) {
  const blobRaw = Uint8Array.from(atob(CONTACTS_BLOB), c => c.charCodeAt(0));
  const salt = blobRaw.slice(0, 16);
  const iv = blobRaw.slice(16, 28);
  const cipherWithTag = blobRaw.slice(28);

  const enc = new TextEncoder();
  const passwordKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 250000, hash: 'SHA-256' },
    passwordKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv },
    key,
    cipherWithTag
  );
  return JSON.parse(new TextDecoder().decode(decrypted));
}

function injectContacts(contacts) {
  for (const p of PEOPLE) {
    const c = contacts[p.id];
    if (!c) continue;
    if (c.phone) p.phone = c.phone;
    if (c.contact_label) p.contact_label = c.contact_label;
  }
  document.body.classList.add('contacts-unlocked');
  const btn = document.getElementById('lock-toggle');
  if (btn) btn.innerHTML = '&#128275; Unlocked';
  renderAll();
}

function clearContacts() {
  // Re-load defaults from the file's PEOPLE data by reloading
  try { sessionStorage.removeItem(CONTACTS_KEY); } catch(e) {}
  location.reload();
}

async function tryUnlock(password) {
  try {
    const contacts = await decryptContacts(password);
    try { sessionStorage.setItem(CONTACTS_KEY, password); } catch(e) {}
    injectContacts(contacts);
    closeLockModal();
    return true;
  } catch (e) {
    return false;
  }
}

function openLockModal() {
  document.getElementById('lock-modal-mask').classList.add('open');
  document.getElementById('lock-err').classList.remove('show');
  document.getElementById('lock-input').value = '';
  setTimeout(() => document.getElementById('lock-input').focus(), 50);
}
function closeLockModal() {
  document.getElementById('lock-modal-mask').classList.remove('open');
}

document.getElementById('lock-toggle').addEventListener('click', () => {
  if (document.body.classList.contains('contacts-unlocked')) {
    if (confirm('Hide contacts and reload the page?')) clearContacts();
  } else {
    openLockModal();
  }
});
document.getElementById('lock-cancel').addEventListener('click', closeLockModal);
document.getElementById('lock-go').addEventListener('click', async () => {
  const pw = document.getElementById('lock-input').value;
  const ok = await tryUnlock(pw);
  if (!ok) document.getElementById('lock-err').classList.add('show');
});
document.getElementById('lock-input').addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const ok = await tryUnlock(document.getElementById('lock-input').value);
    if (!ok) document.getElementById('lock-err').classList.add('show');
  }
});
document.getElementById('lock-modal-mask').addEventListener('click', (e) => {
  if (e.target.id === 'lock-modal-mask') closeLockModal();
});

// Auto-unlock if session has the password cached
(async () => {
  try {
    const cached = sessionStorage.getItem(CONTACTS_KEY);
    if (cached) {
      const contacts = await decryptContacts(cached);
      injectContacts(contacts);
    }
  } catch (e) { /* ignore */ }
})();

</script>
</body>
